<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WWDead Snapshot Viewer</title>

  <!-- Inject live WWDead CSS -->
  <link rel="stylesheet" href="https://wwdead.com/classic/style.css">

  <!-- Optional: favicon like the game -->
  <link rel="icon" type="image/png" href="https://wwdead.com/classic/favicon.png">

  <style>
    body {
      padding: 10px;
      background: #000; /* fallback if CSS fails */
    }
    #snapshot-container {
      max-width: 1200px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div id="snapshot-container">
    Loading snapshot...
  </div>

  <script>
    // Grab snapshot from URL hash
    function loadSnapshotFromHash() {
      const hash = decodeURIComponent(location.hash.slice(1));
      if (!hash) {
        document.getElementById('snapshot-container').innerHTML = '<p>No snapshot found in URL.</p>';
        return;
      }

      try {
        const html = atob(hash); // decode base64
        document.getElementById('snapshot-container').innerHTML = html;
      } catch (e) {
        document.getElementById('snapshot-container').innerHTML = '<p>Error loading snapshot.</p>';
        console.error(e);
      }
    }

    window.addEventListener('DOMContentLoaded', loadSnapshotFromHash);
  </script>
</body>
</html>
