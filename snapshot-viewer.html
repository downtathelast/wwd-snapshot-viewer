<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>WWDead Snapshot Viewer</title>

  <!-- Base URL for WWDead assets -->
  <base href="https://wwdead.com/classic/">

  <style>
    body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
    #snapshot-container { border: 2px solid #666; padding: 10px; background: #000; }
    #snapshot-container a { color: #f99; }
    #error { color: red; }
  </style>
</head>
<body>
  <h1>WWDead Snapshot Viewer</h1>
  <p>Snapshot will load below from URL hash.</p>
  <div id="snapshot-container"></div>
  <div id="error"></div>

  <script>
    (function() {
      const container = document.getElementById('snapshot-container');
      const errorDiv = document.getElementById('error');

      function loadSnapshot() {
        const hash = decodeURIComponent(window.location.hash.slice(1));
        if (!hash) {
          errorDiv.textContent = "No snapshot data found in URL hash.";
          return;
        }

        try {
          // Try to parse as Base64
          const html = atob(hash);
          container.innerHTML = html;
        } catch(e) {
          errorDiv.textContent = "Failed to decode snapshot: " + e.message;
        }
      }

      loadSnapshot();
    })();
  </script>
</body>
</html>
