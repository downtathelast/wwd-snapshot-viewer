<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UD Snapshot Viewer</title>
</head>
<body>
<script>
(function(){
    const hash = location.hash.slice(1);
    if(!hash) { document.body.innerHTML = '<p>No snapshot provided.</p>'; return; }
    try {
        const html = decodeURIComponent(escape(atob(hash)));
        document.open();
        document.write(html);
        document.close();
    } catch(e) {
        document.body.innerHTML = '<p>Failed to decode snapshot.</p>';
        console.error(e);
    }
})();
</script>
</body>
</html>
